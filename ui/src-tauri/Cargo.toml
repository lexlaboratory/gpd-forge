# GPD Forge — Tauri 2 desktop shell. GPL-3.0-or-later.
[package]
name = "gpd-forge"
version = "0.0.0"
description = "GPD Forge desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
