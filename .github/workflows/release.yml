name: release

# Cut a release when a vX.Y.Z tag is pushed (or run manually).
# The PORTABLE bundle (Via 0: signed dotnet host + browser UI, no unsigned binary) is always built
# and attached. The native desktop .exe/installer is built and SIGNED only when signing is enabled
# (repo variable SIGN_RELEASE=true + the SignPath secrets/variables) — an unsigned native binary
# would be blocked by Smart App Control anyway, so it stays gated until you activate SignPath.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: write   # create the GitHub Release
  actions: read     # SignPath reads the workflow-artifact metadata to verify the build

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install UI deps
        run: npm --prefix ui ci
      - name: Package portable bundle
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart('v') }
          Write-Host "Packaging portable v$v"
          ./scripts/package-portable.ps1 -Version $v

      # Extract THIS version's notes. `body_path: CHANGELOG.md` published v0.2.0 with the whole file
      # as its body - header, empty [Unreleased] section and every previous release's notes - and
      # nobody saw it until it was public, because this workflow finishes before a human looks.
      #
      # The script exits non-zero when the version has no section, which fails the job on purpose: a
      # missing section means the changelog was not updated for this release, and falling back to the
      # whole file would silently recreate the bug.
      - name: Extract release notes for this version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart('v') }
          ./scripts/changelog-section.ps1 -Version $v -OutFile release-notes.md
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable
          path: dist-release/*.zip
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.zip
          body_path: release-notes.md

  signed-native:
    runs-on: windows-latest
    needs: portable
    # Only when signing is configured. Until then this whole job is skipped, so the release still
    # ships the portable bundle. See docs/signing.md to activate.
    if: startsWith(github.ref, 'refs/tags/') && vars.SIGN_RELEASE == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install UI deps
        run: npm --prefix ui ci
      - name: Build the native desktop app (Tauri) + installer
        run: npm --prefix ui run tauri -- build
      # SignPath needs the artifact stored as a GitHub Actions artifact before it can sign it, and
      # verifies (via the SignPath GitHub App) that a real workflow built it on GitHub-hosted runners.
      # Keep a separate name so the signing job does not accidentally consume the portable one.
      - name: Upload unsigned bundle
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-bundle
          path: ui/src-tauri/target/release/bundle
          if-no-files-found: error
      - name: Submit signing request (SignPath)
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          # The SignPath Artifact Configuration governs how the ZIP is unpacked and which files are
          # signed. A zip-file root with <signable-file recurse="true"> covering *.exe and *.msi works.
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-bundle
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach signed artifacts to the Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            signed-bundle/**/*.exe
            signed-bundle/**/*.msi
